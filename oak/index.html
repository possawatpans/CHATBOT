<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>พศวัต พันธุ์แสงสวัสดิ์ | Full-Stack Developer & Database Specialist</title>
<style>
:root{
  --bg:#f4f7f4;--surface:#ffffff;--ink:#1b2e23;--muted:#4a6353;--line:#d0dfd4;
  --accent:#2d6a4f;--accent-soft:#e8f4ec;--accent-ink:#1b4332;--chip:#e2ede5;--on-accent:#ffffff;
  --dark:#1b2e23;--on-dark:#f4f7f4;--on-dark-muted:#b7c9bd;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a14;--surface:#15241b;--ink:#e2ede5;--muted:#95b39e;--line:#22382c;
    --accent:#52b788;--accent-soft:#183222;--accent-ink:#90e0ef;--chip:#1f3629;--on-accent:#081c15;
    --dark:#1f3629;--on-dark:#f4f7f4;--on-dark-muted:#b7c9bd;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a14;--surface:#15241b;--ink:#e2ede5;--muted:#95b39e;--line:#22382c;
  --accent:#52b788;--accent-soft:#183222;--accent-ink:#90e0ef;--chip:#1f3629;--on-accent:#081c15;
  --dark:#1f3629;--on-dark:#f4f7f4;--on-dark-muted:#b7c9bd;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:64rem;margin:0 auto;padding:0 1.25rem}
section{padding:2.5rem 0}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.25}
h2{font-size:1.5rem;font-weight:700}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{display:flex;flex-direction:column;gap:2rem;padding-top:3rem}
.avatar{width:7rem;height:7rem;border-radius:50%;background:var(--dark);color:var(--on-dark);display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:600;flex:none;overflow:hidden;border:3px solid var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center center}
.bubble{display:inline-block;max-width:100%;padding:.5rem 1rem;border-radius:1rem;font-size:.95rem}
.bubble.me{background:var(--accent);color:var(--on-accent);border-bottom-left-radius:.25rem}
.bubble.you{background:var(--dark);color:var(--on-dark);border-bottom-right-radius:.25rem}
.bubble.card{background:var(--surface);border:1px solid var(--line);border-top-left-radius:.25rem;padding:.75rem 1rem;max-width:36rem;color:var(--muted)}
h1{font-size:2.5rem;font-weight:700;margin-top:1rem}
.role{color:var(--accent-ink);font-weight:600;font-size:1.1rem;margin:.25rem 0 1rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1rem;border-radius:.5rem;font:inherit;font-size:.9rem;font-weight:500;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s, background-color .15s}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.copied{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.btn svg{width:18px;height:18px;flex:none}
@media(min-width:768px){.hero{flex-direction:row;align-items:center;gap:3rem}.avatar{width:9rem;height:9rem;font-size:3rem}h1{font-size:3rem}}

/* popup modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:1rem;z-index:50;backdrop-filter:blur(2px)}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.5rem;width:100%;max-width:24rem;box-shadow:0 20px 25px -5px rgba(0,0,0,.2);animation:pop .2s ease-out}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.modal-head h3{font-size:1.2rem;font-weight:700}
.close-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:.25rem;display:inline-flex;border-radius:.375rem}
.close-btn:hover{color:var(--ink);background:var(--chip)}
.contact-item{display:flex;flex-direction:column;gap:.5rem;padding:.85rem;border:1px solid var(--line);border-radius:.75rem;margin-bottom:.75rem;background:var(--bg)}
.contact-item:last-child{margin-bottom:0}
.contact-label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.contact-val{font-weight:600;font-size:1rem;word-break:break-all}
.copy-small{align-self:flex-start;padding:.35rem .75rem;font-size:.8rem}

/* skills */
.skills{margin-top:1.5rem;border:1px solid var(--line);border-radius:1rem;background:var(--surface)}
.skill-row{display:flex;flex-direction:column;gap:.75rem;padding:1.25rem}
.skill-row+.skill-row{border-top:1px solid var(--line)}
.skill-row h3{font-size:1rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;margin:0;padding:0}
.chips li{background:var(--chip);color:var(--muted);padding:.15rem .75rem;border-radius:999px;font-size:.875rem}
@media(min-width:640px){.skill-row{flex-direction:row;gap:2rem}.skill-row h3{width:14rem;flex:none}}

/* projects */
.grid{display:grid;gap:1rem;margin-top:1.5rem}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}.grid .featured{grid-column:span 2}}
.proj{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);border-radius:1rem;padding:1.5rem}
.proj h3{font-size:1.15rem;font-weight:700}
.proj p{margin:.5rem 0 0;color:var(--muted);max-width:42rem}
.proj .chips{margin-top:1rem}
.proj .chips li{background:var(--accent-soft);color:var(--accent-ink);border-radius:.4rem;font-size:.78rem;font-weight:500;padding:.1rem .6rem}
.proj .links{display:flex;gap:1rem;margin-top:1.25rem;font-size:.9rem;font-weight:500}
.proj .links a{display:inline-flex;align-items:center;gap:.4rem;text-underline-offset:4px}
.proj .links svg{width:16px;height:16px}
.proj.featured{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.proj.featured h3{font-size:1.5rem}
.proj.featured p{color:var(--on-dark-muted)}
.proj.featured .chips li{background:rgba(255,255,255,.12);color:var(--on-dark)}

/* fun facts */
.chat{margin-top:1.5rem;border:1px solid var(--line);background:var(--surface);border-radius:1rem;padding:1.25rem}
.log{display:flex;flex-direction:column;gap:.75rem;min-height:8rem}
.log .empty{margin:auto;color:var(--muted);font-size:.9rem;display:flex;gap:.5rem;align-items:center}
.log .pair{display:flex;flex-direction:column;gap:.5rem}
.log .you{align-self:flex-end}.log .me{align-self:flex-start}
.log .bubble{max-width:85%}
@media(prefers-reduced-motion:no-preference){.pair{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
.asks{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--line)}
.ask{font:inherit;font-size:.875rem;padding:.35rem .9rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.ask:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.ask:disabled{color:var(--muted);opacity:.5;cursor:default}
.ask.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent);display:inline-flex;gap:.4rem;align-items:center}
.ask.go svg{width:16px;height:16px}
.ask.clear{border:0;text-decoration:underline;text-underline-offset:4px;color:var(--muted)}
footer{padding:1rem 0 3rem;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero" id="hero"></section>
  <section aria-labelledby="skills-t"><h2 id="skills-t">ทักษะและเครื่องมือ</h2><div class="skills" id="skills"></div></section>
  <section aria-labelledby="proj-t"><h2 id="proj-t">ผลงานเด่น</h2><div class="grid" id="projects"></div></section>
  <section aria-labelledby="fun-t">
    <h2 id="fun-t" data-fun-title></h2>
    <p style="color:var(--muted);margin:.25rem 0 0" data-fun-sub></p>
    <div class="chat">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="asks" id="asks"></div>
    </div>
  </section>
</main>

<!-- ป็อปอัพช่องทางติดต่อ -->
<div class="modal-backdrop" id="contactModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">ช่องทางติดต่อ</h3>
      <button type="button" class="close-btn" id="closeModalBtn" aria-label="ปิดหน้าต่าง">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ===== แก้ข้อมูลของตัวเองที่ส่วนนี้ ===== */
const PROFILE = {
  firstName: "พศวัต", lastName: "พันธุ์แสงสวัสดิ์", nickname: "โอ๊ค",
  role: "Full-Stack Developer & Database Specialist",
  avatarUrl: "https://i.postimg.cc/6pW7pQGY/S-42754102.jpg", // ใส่ลิงก์รูปภาพของคุณตรงนี้
  greeting: "สวัสดีครับ ผมชื่อโอ๊ค 👋",
  intro: "นักศึกษาวิศวกรรมปัญญาประดิษฐ์ ถนัดด้าน 3D Modeling, Interactive Media และ Web Development",
  github: "https://github.com/project080030", // ลิงก์ GitHub ของคุณ
  email: "possawat.pans@bumail.net",                 // <--- [ใส่ Email ของคุณบรรทัดนี้]
  phone: "097-121-0158"                       // <--- [ใส่เบอร์โทรศัพท์ของคุณบรรทัดนี้]
};
const SKILLS = [
  { category: "Backend, Database & DevOps", items: ["Express", "PostgreSQL", "Node.js", "Docker"] }
];
const PROJECTS = [
  { title: "AI & 3D Interactive Project",
    description: "โปรเจกต์พัฒนาสื่อผสมผสานและระบบปัญญาประดิษฐ์",
    stack: ["Python","TouchDesigner","React","Supabase"], github: "https://github.com/possawatpans/CHATBOT/tree/main", demo: "" },
];
const FUN_FACTS = [
  { q: "ทำไมถึงสนใจ AI และ 3D?", a: "ชอบการผสมผสานระหว่างโลกดิจิทัล 3 มิติกับระบบปัญญาประดิษฐ์ที่โต้ตอบได้จริง" },
  { q: "เครื่องมือหลักที่ใช้บ่อย?", a: "Python, TouchDesigner, Blender และ VS Code" },
  { q: "ถ้าไม่ได้เขียนโค้ดจะทำอะไร?", a: "ปั้นโมเดล 3D หรือหาไอเดียทำ Interactive Media ใหม่ๆ" },
  { q: "สไตล์การทำงาน?", a: "เน้นผสมผสานระหว่างงานดีไซน์ครีเอทีฟและระบบหลังบ้านที่แข็งแรง" }
];
/* ===== จบส่วนข้อมูล ===== */

const ICON = {
  gh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>',
  contact: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  mail: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
  phone: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>',
  chat: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
  dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01M10 14h.01M15 6h.01M18 9h.01"/></svg>'
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

document.title = `${PROFILE.firstName} ${PROFILE.lastName} | ${PROFILE.role}`;

$("hero").innerHTML = `
  <div class="avatar" role="img" aria-label="รูปโปรไฟล์ของ ${esc(PROFILE.firstName)}">
    ${PROFILE.avatarUrl && PROFILE.avatarUrl !== "ใส่ลิงก์รูปภาพของคุณตรงนี้" ? `<img src="${esc(PROFILE.avatarUrl)}" alt="">` : esc(PROFILE.nickname.charAt(0))}
  </div>
  <div>
    <div class="bubble me">${esc(PROFILE.greeting)}</div>
    <h1>${esc(PROFILE.firstName)} ${esc(PROFILE.lastName)}</h1>
    <p class="role">${esc(PROFILE.role)}</p>
    <div class="bubble card">${esc(PROFILE.intro)}</div>
    <div class="btns">
      <a class="btn primary" href="${esc(PROFILE.github)}" target="_blank" rel="noreferrer">${ICON.gh}GitHub</a>
      <button type="button" class="btn" id="openContactBtn">${ICON.contact}ช่องทางติดต่อ</button>
    </div>
  </div>`;

// สร้างเนื้อหาในป็อปอัพ
$("modalBody").innerHTML = `
  <div class="contact-item">
    <div class="contact-label">${ICON.mail} อีเมล</div>
    <div class="contact-val">${esc(PROFILE.email)}</div>
    <button type="button" class="btn copy-small" data-copy="${esc(PROFILE.email)}">${ICON.copy}<span>คัดลอกอีเมล</span></button>
  </div>
  <div class="contact-item">
    <div class="contact-label">${ICON.phone} เบอร์โทรศัพท์</div>
    <div class="contact-val">${esc(PROFILE.phone)}</div>
    <button type="button" class="btn copy-small" data-copy="${esc(PROFILE.phone)}">${ICON.copy}<span>คัดลอกเบอร์โทร</span></button>
  </div>
`;

// เปิด/ปิด ป็อปอัพ
const modal = $("contactModal");
$("openContactBtn").addEventListener("click", () => modal.classList.add("open"));
$("closeModalBtn").addEventListener("click", () => modal.classList.remove("open"));
modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) modal.classList.remove("open"); });

// ฟังก์ชันคัดลอกในป็อปอัพ
$("modalBody").addEventListener("click", function(e) {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  const textToCopy = btn.dataset.copy;
  navigator.clipboard.writeText(textToCopy).then(() => {
    const originalHTML = btn.innerHTML;
    btn.classList.add("copied");
    btn.innerHTML = `${ICON.check}<span>คัดลอกแล้ว!</span>`;
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.innerHTML = originalHTML;
    }, 2000);
  });
});

$("skills").innerHTML = SKILLS.map(g => `
  <div class="skill-row"><h3>${esc(g.category)}</h3>
  <ul class="chips">${g.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");

$("projects").innerHTML = PROJECTS.map((p, i) => `
  <article class="proj${i === 0 ? " featured" : ""}">
    <h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>
    <ul class="chips">${p.stack.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    <div class="links">
      ${p.github ? `<a href="${esc(p.github)}" target="_blank" rel="noreferrer">${ICON.gh}ดูโค้ดบน GitHub</a>` : ""}
      ${p.demo ? `<a href="${esc(p.demo)}" target="_blank" rel="noreferrer">${ICON.out}ดูรายละเอียด</a>` : ""}
    </div>
  </article>`).join("");

document.querySelector("[data-fun-title]").textContent = `ลองถาม${PROFILE.nickname}ดู`;
document.querySelector("[data-fun-sub]").textContent = `เลือกคำถามด้านล่าง แล้วดูว่า${PROFILE.nickname}ตอบว่าอะไร`;

let asked = [];
function renderChat() {
  $("log").innerHTML = asked.length
    ? asked.map(i => `<div class="pair"><div class="bubble you">${esc(FUN_FACTS[i].q)}</div><div class="bubble me">${esc(FUN_FACTS[i].a)}</div></div>`).join("")
    : `<p class="empty">${ICON.chat}ยังไม่มีข้อความ เริ่มจากกดคำถามได้เลย</p>`;
  $("asks").innerHTML =
    FUN_FACTS.map((f, i) => `<button class="ask" data-i="${i}" ${asked.includes(i) ? "disabled" : ""}>${esc(f.q)}</button>`).join("") +
    `<button class="ask go" data-act="random" ${asked.length === FUN_FACTS.length ? "disabled" : ""}>${ICON.dice}สุ่มให้</button>` +
    (asked.length ? `<button class="ask clear" data-act="clear">ล้างแชต</button>` : "");
}
$("asks").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.i !== undefined) asked.push(+b.dataset.i);
  else if (b.dataset.act === "clear") asked = [];
  else if (b.dataset.act === "random") {
    const left = FUN_FACTS.map((_, i) => i).filter(i => !asked.includes(i));
    if (left.length) asked.push(left[Math.floor(Math.random() * left.length)]);
  }
  renderChat();
});
renderChat();
</script>
